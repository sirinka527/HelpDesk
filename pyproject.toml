[project]
name = "helpdesk"
version = "0.1.0"
description = "система учёта технических обращений"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
helpdesk = "helpdesk:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
